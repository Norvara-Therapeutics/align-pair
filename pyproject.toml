[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "norvara-align-pair"
version = "1.0.0rc4"
description = "Global, glocal, overlap and local pairwise sequence alignment with affine gaps and published substitution matrices, from no third-party dependencies"
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [
    { name = "Norvara Therapeutics", email = "research@norvaratx.com" },
]
maintainers = [
    { name = "Norvara Therapeutics", email = "research@norvaratx.com" },
]
keywords = ["bioinformatics", "sequence-alignment", "needleman-wunsch", "smith-waterman", "blosum", "affine-gap"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Norvara-Therapeutics/align-pair"
Repository = "https://github.com/Norvara-Therapeutics/align-pair.git"
Issues = "https://github.com/Norvara-Therapeutics/align-pair/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pyflakes>=3",
    "tomli>=1.1; python_version < '3.11'",
]

[project.scripts]
align-pair = "align_pair.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
align_pair = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
